<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi trayectoria · Javi Cantón-Correa</title>
<meta name="description" content="Stream graph de la trayectoria académica y profesional de Javi Cantón-Correa.">
<style>
  :root {
    --surface: #f7f3ea;
    --ink: #2b2a28;
    --ink-2: #5d5a54;
    --ink-3: #8c877d;
    --rule: #d9d2c2;
    --accent: #c2385a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1320px; margin: 0 auto; padding: 32px 24px 48px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 500; font-size: clamp(26px, 3.6vw, 44px); line-height: 1.1; margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--ink-2); font-size: 15px; max-width: 760px; margin: 0; line-height: 1.45; }
  .lang { display: flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; flex: none; }
  .lang button {
    font: inherit; font-size: 13px; padding: 6px 14px; border: 0; background: transparent;
    color: var(--ink-2); cursor: pointer;
  }
  .lang button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 22px 0 4px; font-size: 13px; }
  .legend .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .legend .gname { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; cursor: default; color: var(--ink-2); }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .scroll { overflow-x: auto; position: relative; }
  svg { display: block; width: 100%; min-width: 980px; height: auto; }
  svg text { font-family: inherit; }
  .layer { transition: opacity .15s; }
  .dim .layer:not(.on) { opacity: .22; }
  .bar-link:hover text { text-decoration: underline; }
  .tooltip {
    position: absolute; pointer-events: none; background: #fffdf8; border: 1px solid var(--rule);
    border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.4; max-width: 300px;
    box-shadow: 0 6px 20px rgba(60, 50, 30, .12); opacity: 0; transition: opacity .1s; z-index: 5;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-title { font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .tooltip .tt-sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .tooltip .tt-meta { color: var(--ink-3); font-size: 12px; margin: 2px 0 4px; }
  .tooltip .tt-proj { color: var(--ink-2); font-size: 12px; margin-top: 6px; }
  details { margin-top: 20px; font-size: 13px; color: var(--ink-2); }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 10px; width: 100%; max-width: 900px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
  footer { margin-top: 22px; font-size: 12px; color: var(--ink-3); line-height: 1.6; }
  a { color: inherit; text-underline-offset: 2px; }
  footer a:hover { color: var(--ink); }
  /* Modo incrustado (?embed=1): solo el stream graph */
  .embed .page { padding: 0; max-width: none; }
  .embed header, .embed .legend, .embed details, .embed footer, .embed .tus-datos { display: none; }
  .aviso { background: #fbe9e4; border: 1px solid #e8b9ab; color: #7a2e1c; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin: 14px 0; }
  .aviso:empty { display: none; }
  .aviso ul { margin: 4px 0 0; padding-left: 18px; }
  .tus-datos { margin-top: 20px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .tus-datos h2 { font-size: 14px; color: var(--ink); margin: 0 0 4px; }
  .tus-datos p { margin: 4px 0 8px; max-width: 760px; }
  .tus-datos .fila { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .tus-datos label.boton { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 5px 14px; cursor: pointer; color: var(--ink); }
  .tus-datos label.boton:hover { background: var(--ink); color: var(--surface); }
  .tus-datos input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .tus-datos input[type=file]:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lang[hidden] { display: none; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="lang" role="tablist" aria-label="Idioma / Language">
      <button role="tab" data-lang="es">Español</button>
      <button role="tab" data-lang="en">English</button>
    </div>
  </header>
  <div class="aviso" id="aviso" role="alert"></div>
  <div class="legend" id="legend"></div>
  <div class="scroll" id="scroll">
    <svg id="chart" role="img"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <details>
    <summary id="table-summary"></summary>
    <div id="table"></div>
  </details>
  <section class="tus-datos" id="tus-datos">
    <h2 id="td-titulo"></h2>
    <p id="td-texto"></p>
    <div class="fila">
      <input type="file" id="td-input" accept=".csv,text/csv" multiple>
      <label class="boton" for="td-input" id="td-boton"></label>
      <span id="td-plantillas"></span>
      <span id="td-estado"></span>
    </div>
  </section>
  <footer id="footer"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

<!-- ============================================================
     DATOS: se leen de los CSV de la carpeta data/ (ver README).
     ?datos=URL carga los CSV de otra carpeta (debe permitir CORS).
     ============================================================ -->
<script>
const CSV_FILES = ["config", "capas", "valores", "eventos", "barras"];

// Textos de la interfaz (no dependen de los datos).
const UI = {
  hoy: { es: "hoy", en: "today" },
  tabla: { es: "Ver los datos en tabla", en: "View data as a table" },
  thCapa: { es: "Capa", en: "Stream" }, thGrupo: { es: "Grupo", en: "Group" },
  thPeriodo: { es: "Periodo", en: "Period" }, thDesc: { es: "Descripción", en: "Description" },
  proyRel: { es: "Proyectos", en: "Projects" },
  tdTitulo: { es: "Usa tus propios datos", en: "Use your own data" },
  tdTexto: { es: "Este gráfico se dibuja a partir de cinco tablas CSV. Descarga las plantillas, edítalas en una hoja de cálculo y súbelas aquí para ver tu propio gráfico (los archivos no salen de tu navegador). Para publicarlo, haz un fork del repositorio y sustituye los CSV de la carpeta data/.",
             en: "This chart is drawn from five CSV tables. Download the templates, edit them in a spreadsheet and upload them here to preview your own chart (files never leave your browser). To publish it, fork the repository and replace the CSV files in the data/ folder." },
  tdBoton: { es: "Subir CSV", en: "Upload CSV" },
  tdPlantillas: { es: "Plantillas:", en: "Templates:" },
  tdCargados: { es: "Cargados:", en: "Loaded:" },
  errCarga: { es: "No se han podido cargar los datos", en: "Could not load the data" },
  errLocal: { es: "Si has abierto el archivo directamente, sírvelo con un servidor local (por ejemplo, python3 -m http.server) o publícalo en GitHub Pages.", en: "If you opened the file directly, serve it with a local server (e.g. python3 -m http.server) or publish it on GitHub Pages." },
  avisos: { es: "Revisa los datos:", en: "Check the data:" }
};

// ---------- Lectura y validación de los CSV ----------
const CsvData = (function () {
  const num = v => { if (v == null) return null; v = String(v).trim().replace(",", "."); if (v === "") return null; const n = +v; return isFinite(n) ? n : null; };
  const str = v => (v == null ? "" : String(v).trim());
  const yes = v => /^(s[ií]|1|true|x|yes|y)$/i.test(str(v));
  const bi = (r, k) => ({ es: str(r[k + "_es"]), en: str(r[k + "_en"]) });
  function parse(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/, 1)[0];
    const sep = (first.split(";").length > first.split(",").length) ? ";" : ","; // Excel en español exporta con ";"
    return d3.dsvFormat(sep).parse(text).map(r => { const o = {}; for (const k in r) o[k.trim().toLowerCase()] = r[k]; return o; });
  }
  function nowYear() { const d = new Date(), y = d.getFullYear(); return y + (d - new Date(y, 0, 1)) / (new Date(y + 1, 0, 1) - new Date(y, 0, 1)); }

  function build(texts) {
    const avisos = [];
    const T = {}; CSV_FILES.forEach(f => T[f] = texts[f] ? parse(texts[f]) : []);
    CSV_FILES.forEach(f => { if (!texts[f]) avisos.push(`Falta ${f}.csv`); });

    const cfg = {}; T.config.forEach(r => { const k = str(r.clave); if (k) cfg[k] = { es: str(r.es), en: str(r.en) }; });
    const cfgNum = k => cfg[k] ? num(cfg[k].es) : null;

    // capas
    const fallback = d3.schemeTableau10;
    const capas = T.capas.filter(r => str(r.id)).map((r, i) => ({
      id: str(r.id), grupo: str(r.grupo) || "otros", color: str(r.color) || fallback[i % fallback.length],
      desde: num(r.desde), hasta: num(r.hasta),
      nombre: bi(r, "nombre"), corto: bi(r, "corto"), desc: bi(r, "desc"),
      proyectos: str(r.proyectos), url: str(r.url), valores: {}
    }));
    capas.forEach(c => { if (!c.corto.es) c.corto = c.nombre; if (!c.nombre.es) c.nombre = { es: c.id, en: "" }; });
    const byId = Object.fromEntries(capas.map(c => [c.id, c]));

    // valores (formato ancho: una fila por año, una columna por capa)
    const yearCol = T.valores.length ? Object.keys(T.valores[0]).find(k => /^(año|ano|anio|year)$/.test(k)) : null;
    if (T.valores.length && !yearCol) avisos.push("valores.csv necesita una columna «año»");
    const desconocidas = new Set();
    T.valores.forEach(r => {
      const y = num(r[yearCol]); if (y == null) return;
      for (const k in r) {
        if (k === yearCol) continue;
        const v = num(r[k]); if (v == null) continue;
        if (byId[k]) byId[k].valores[y] = Math.max(0, v); else desconocidas.add(k);
      }
    });
    desconocidas.forEach(k => avisos.push(`valores.csv: la columna «${k}» no coincide con ningún id de capas.csv`));
    const vacias = capas.filter(c => !Object.keys(c.valores).length);
    vacias.forEach(c => avisos.push(`La capa «${c.id}» no tiene valores en valores.csv`));
    const capasOk = capas.filter(c => Object.keys(c.valores).length);
    capasOk.forEach(c => { if (c.desde == null) c.desde = d3.min(Object.keys(c.valores), Number); });

    // grupos de la leyenda: primero en el orden de config.csv, luego el resto en orden de aparición
    const usados = new Set(capasOk.map(c => c.grupo)), grupos = {};
    Object.keys(cfg).filter(k => k.startsWith("grupo.") && usados.has(k.slice(6))).forEach(k => grupos[k.slice(6)] = cfg[k]);
    capasOk.forEach(c => { if (!grupos[c.grupo]) grupos[c.grupo] = { es: c.grupo, en: "" }; });

    // eventos
    const ev = T.eventos.map(r => ({ tipo: str(r.tipo).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""), x: num(r["año"] ?? r.ano ?? r.anio ?? r.year), texto: bi(r, "texto"), url: str(r.url), capa: str(r.capa) || undefined }))
      .filter(e => e.x != null && e.texto.es);
    ev.forEach(e => { if (e.capa && !byId[e.capa]) { avisos.push(`eventos.csv: capa «${e.capa}» desconocida`); e.capa = undefined; } });

    // barras, agrupadas por sección en orden de aparición
    const secciones = [];
    T.barras.forEach(r => {
      const sec = str(r.seccion || r["sección"]); const d = { nombre: bi(r, "nombre"), desde: num(r.desde), hasta: num(r.hasta), tipo: str(r.capa) || null, url: str(r.url), destacada: yes(r.destacada) };
      if (!sec || !d.nombre.es || d.desde == null) return;
      if (d.tipo && !byId[d.tipo]) { avisos.push(`barras.csv: capa «${d.tipo}» desconocida`); d.tipo = null; }
      let s = secciones.find(x => x.id === sec);
      if (!s) secciones.push(s = { id: sec, titulo: cfg["seccion." + sec] || { es: sec, en: "" }, items: [] });
      s.items.push(d);
    });

    const hoy = cfgNum("hoy") ?? nowYear();
    const minYear = d3.min([...capasOk.map(c => c.desde), ...secciones.flatMap(s => s.items.map(d => d.desde))]);
    const X0 = cfgNum("inicio") ?? Math.floor(minYear ?? hoy - 10);
    const X1 = cfgNum("fin") ?? Math.ceil(hoy + 0.001);
    const txt = k => cfg[k] || { es: "", en: "" };
    const bilingue = [txt("titulo"), ...capasOk.map(c => c.nombre)].some(o => o.en);

    return {
      avisos, bilingue,
      DATA: {
        dominio: [X0, X1], hoy: Math.min(hoy, X1),
        textos: { ...UI, titulo: txt("titulo"), subtitulo: txt("subtitulo"), ejeY: txt("eje_y"), pie: txt("pie") },
        grupos, capas: capasOk,
        hitos: ev.filter(e => e.tipo === "hito"), titulos: ev.filter(e => e.tipo === "titulo"),
        secciones
      }
    };
  }

  async function fetchAll(base) {
    const out = {};
    await Promise.all(CSV_FILES.map(async f => {
      const r = await fetch(base + f + ".csv", { cache: "no-cache" });
      if (!r.ok) throw new Error(`${f}.csv: HTTP ${r.status}`);
      out[f] = await r.text();
    }));
    return out;
  }
  return { build, fetchAll };
})();
</script>

<script>
const params = new URLSearchParams(location.search);
const EMBED = params.has("embed"); // ?embed=1 muestra solo el stream graph (sin título, leyenda ni barras)
if (EMBED) document.documentElement.classList.add("embed");
let lang = (location.hash.replace("#", "") === "en" || params.get("lang") === "en") ? "en" : "es";

// Seguridad: los CSV pueden venir de fuera (?datos=), así que se escapa el texto y se filtran los enlaces.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => (u && /^(https?:\/\/|mailto:|\.{0,2}\/|#)/i.test(u.trim())) ? u.trim() : "";
function safeHtml(html) { // solo texto, <a href> y <br>
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html"), out = document.createElement("div");
  (function walk(src, dst) {
    src.childNodes.forEach(n => {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.textContent));
      else if (n.nodeName === "BR") dst.appendChild(document.createElement("br"));
      else if (n.nodeName === "A") { const a = document.createElement("a"); const h = safeUrl(n.getAttribute("href")); if (h) a.href = h; walk(n, a); dst.appendChild(a); }
      else if (n.nodeType === 1 && !/^(SCRIPT|STYLE|TEMPLATE)$/.test(n.nodeName)) walk(n, dst);
    });
  })(doc.body.firstChild, out);
  return out.innerHTML;
}

function start(DATA, bilingue) {
  if (!bilingue) lang = "es";
  d3.select(".lang").attr("hidden", bilingue ? null : "");
  DATA.capas.forEach(c => c.url = safeUrl(c.url));
  [...DATA.hitos, ...DATA.titulos, ...DATA.secciones.flatMap(s => s.items)].forEach(d => d.url = safeUrl(d.url));
  const SURFACE = "#f7f3ea", INK = "#2b2a28", INK2 = "#5d5a54", INK3 = "#8c877d", RULE = "#d9d2c2", NEUTRAL = "#9a958a";
  const t = o => (o == null ? "" : (typeof o === "string" ? o : (o[lang] || o.es || "")));
  const byId = Object.fromEntries(DATA.capas.map(c => [c.id, c]));
  const colorOf = id => (id && byId[id]) ? byId[id].color : NEUTRAL;

  const ctx = document.createElement("canvas").getContext("2d");
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  function textW(s, size, weight) { ctx.font = `${weight || 400} ${size}px ${FONT}`; return ctx.measureText(s).width; }
  function lum(hex) {
    const c = d3.color(hex); const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
  }

  // ---------- Serie por capa ----------
  const [X0, X1] = DATA.dominio, END = DATA.hoy, STEP = 0.05;
  const xs = d3.range(X0, END + STEP / 2, STEP);
  const smooth = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
  function valueAt(c, x) {
    const ks = Object.keys(c.valores).map(Number).sort((a, b) => a - b);
    const px = ks.map(k => k + 0.5);
    let v;
    if (x <= px[0]) v = c.valores[ks[0]];
    else if (x >= px[px.length - 1]) v = c.valores[ks[ks.length - 1]];
    else { const i = d3.bisectRight(px, x) - 1; const u = (x - px[i]) / (px[i + 1] - px[i]); v = c.valores[ks[i]] * (1 - u) + c.valores[ks[i + 1]] * u; }
    return v;
  }
  function envelope(c, x) {
    const R = 0.8;
    // rampas centradas en la fecha: un relevo (acaba una capa, empieza otra) no deja hueco
    let env = (c.desde > X0) ? smooth((x - c.desde) / R + 0.5) : 1;
    if (c.hasta != null) env *= smooth((c.hasta - x) / R + 0.5);
    return env;
  }
  function gauss(arr, sigma) {
    const r = Math.ceil(sigma * 3), k = d3.range(-r, r + 1).map(i => Math.exp(-(i * i) / (2 * sigma * sigma)));
    return arr.map((_, i) => { let s = 0, w = 0; for (let j = -r; j <= r; j++) { const q = Math.min(arr.length - 1, Math.max(0, i + j)); s += arr[q] * k[j + r]; w += k[j + r]; } return s / w; });
  }
  const series = {};
  DATA.capas.forEach(c => {
    let raw = xs.map(x => valueAt(c, x));
    raw = gauss(raw, 0.3 / STEP);
    // la envolvente se aplica tras suavizar: la capa vale exactamente 0 fuera de su periodo
    series[c.id] = raw.map((v, i) => v * envelope(c, xs[i]));
  });
  const rows = xs.map((x, i) => { const r = { x }; DATA.capas.forEach(c => r[c.id] = series[c.id][i]); return r; });
  const stack = d3.stack().keys(DATA.capas.map(c => c.id)).offset(d3.stackOffsetSilhouette)(rows);

  // ---------- Empaquetado de etiquetas en niveles ----------
  function assignLevels(items) { // texto a la derecha de su línea guía; se coloca de derecha a izquierda
    const levels = [];
    items.slice().sort((p, q) => q.px - p.px).forEach(it => {
      let L = 0;
      for (;; L++) {
        const row = levels[L] || [];
        const overlap = row.some(b => it.x < b.x1 + 10 && it.x + it.w > b.x0 - 10);
        const crossed = levels.slice(L + 1).some(r => r.some(b => b.px > it.x - 6 && b.px < it.x + it.w + 6));
        if (!overlap && !crossed) break;
      }
      (levels[L] = levels[L] || []).push({ x0: it.x, x1: it.x + it.w, px: it.px });
      it.level = L;
    });
    return levels.length;
  }
  function packLanes(items) { // items: {x0, x1}
    const lanes = [];
    items.forEach(it => {
      let L = 0;
      while (lanes[L] != null && lanes[L] > it.x0 - 8) L++;
      lanes[L] = it.x1; it.lane = L;
    });
    return lanes.length;
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = (lang === "es" ? "Mi trayectoria" : "My career") + " · Javi Cantón-Correa";
    d3.select("#title").text(t(DATA.textos.titulo));
    d3.select("#subtitle").text(t(DATA.textos.subtitulo));
    d3.selectAll(".lang button").attr("aria-selected", function () { return this.dataset.lang === lang; });
    d3.select("#footer").html(safeHtml(t(DATA.textos.pie)));
    d3.select("#td-titulo").text(t(UI.tdTitulo)); d3.select("#td-texto").text(t(UI.tdTexto));
    d3.select("#td-boton").text(t(UI.tdBoton));
    d3.select("#td-plantillas").html(esc(t(UI.tdPlantillas)) + " " + CSV_FILES.map(f => `<a href="data/${f}.csv" download>${f}.csv</a>`).join(" · "));
    d3.select("#table-summary").text(t(DATA.textos.tabla));

    const W = 1280, M = { l: 30, r: 210 };
    const x = d3.scaleLinear().domain([X0, X1]).range([M.l, W - M.r]);
    const xEnd = x(END);
    const svg = d3.select("#chart"); svg.selectAll("*").remove();
    svg.attr("aria-label", t(DATA.textos.titulo));

    // --- niveles de hitos (arriba) y títulos (abajo) ---
    const FS = 12, ROW = 17;
    const hitos = DATA.hitos.map(h => ({ ...h, px: x(h.x), label: t(h.texto) + (h.url ? " ↗" : "") })).sort((a, b) => a.px - b.px);
    hitos.forEach(h => { h.w = textW(h.label, FS, 600); h.x = h.px + 7; });
    hitos.forEach(h => { if (h.x + h.w > W - 8) h.x = W - 8 - h.w; });
    const nTop = assignLevels(hitos.map(h => h));
    const titulos = DATA.titulos.map(d => ({ ...d, px: x(d.x), label: t(d.texto) + (d.url ? " ↗" : "") })).sort((a, b) => a.px - b.px);
    titulos.forEach(d => { d.w = textW(d.label, FS); d.x = d.px + 7; });
    const nBot = assignLevels(titulos);

    const streamTop = 14 + nTop * ROW + 18, SH = 400, streamBot = streamTop + SH;
    const yExt = [d3.min(stack, s => d3.min(s, d => d[0])), d3.max(stack, s => d3.max(s, d => d[1]))];
    const y = d3.scaleLinear().domain(yExt).range([streamBot, streamTop]);
    const idx = px => Math.max(0, Math.min(xs.length - 1, Math.round((x.invert(px) - X0) / STEP)));
    const topAt = px => y(stack[stack.length - 1][idx(px)][1]);
    const botAt = (px, id) => { const s = id ? stack.find(s => s.key === id) : stack[0]; return y(s[idx(px)][0]); };

    // --- eje Y (rótulo) ---
    svg.append("text").attr("transform", `translate(12,${(streamTop + streamBot) / 2}) rotate(-90)`)
      .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", INK3).text(t(DATA.textos.ejeY));

    // --- capas ---
    const area = d3.area().defined(d => d[1] - d[0] > 0.004)
      .x(d => x(d.data.x)).y0(d => y(d[0])).y1(d => y(d[1])).curve(d3.curveMonotoneX);
    const gLayers = svg.append("g").attr("class", "layers");
    const tip = d3.select("#tooltip"), scroll = document.getElementById("scroll");
    function period(c) {
      const a = Math.floor(c.desde + 0.05), b = c.hasta == null ? t(DATA.textos.hoy) : Math.floor(c.hasta - 0.05);
      return a === b ? `${a}` : `${a} – ${b}`;
    }
    function showTip(ev, c) {
      const yr = Math.floor(x.invert(d3.pointer(ev, svg.node())[0]));
      tip.html(`<div class="tt-title"><span class="tt-sw" style="background:${esc(c.color)}"></span>${esc(t(c.nombre))}</div>
        <div class="tt-meta">${esc(t(DATA.grupos[c.grupo]))} · ${esc(period(c))}</div>
        ${t(c.desc) ? `<div>${esc(t(c.desc))}</div>` : ""}${c.proyectos ? `<div class="tt-proj">${esc(t(DATA.textos.proyRel))}: ${esc(c.proyectos)}</div>` : ""}`);
      const r = scroll.getBoundingClientRect();
      let left = ev.clientX - r.left + scroll.scrollLeft + 14, top = ev.clientY - r.top + 14;
      const tw = tip.node().offsetWidth;
      if (ev.clientX + tw + 30 > window.innerWidth) left -= tw + 28;
      tip.style("left", left + "px").style("top", top + "px").classed("show", true);
    }
    function highlight(id) { svg.classed("dim", !!id); svg.selectAll(".layer").classed("on", function () { return this.dataset.id === id; }); }
    gLayers.selectAll("path").data(stack).join("path")
      .attr("class", "layer").attr("data-id", s => s.key)
      .attr("d", area).attr("fill", s => byId[s.key].color)
      .attr("stroke", SURFACE).attr("stroke-width", 1.4).attr("stroke-linejoin", "round")
      .on("mousemove", (ev, s) => { highlight(s.key); showTip(ev, byId[s.key]); })
      .on("mouseleave", () => { highlight(null); tip.classed("show", false); });

    // --- etiquetas directas ---
    const gLab = svg.append("g").attr("pointer-events", "none");
    const endLabels = [];
    stack.forEach(s => {
      const c = byId[s.key];
      const th = s.map(d => y(d[0]) - y(d[1]));
      let placed = false;
      for (const cand of [{ txt: t(c.nombre), fs: 13 }, { txt: t(c.nombre), fs: 11.5 }, { txt: t(c.corto), fs: 12 }, { txt: t(c.corto), fs: 10.5 }]) {
        const w = textW(cand.txt, cand.fs, 600) + 14, half = Math.ceil((w / 2) / (x(X0 + STEP) - x(X0)));
        let best = -1, bestV = 0, bestC = 0;
        for (let i = half; i < s.length - half; i++) {
          // banda horizontal común a toda la ventana: el texto debe caber entero dentro de la capa
          let lo = -Infinity, hi = Infinity;
          for (let j = i - half; j <= i + half; j++) { const a = y(s[j][1]), b = y(s[j][0]); if (a > lo) lo = a; if (b < hi) hi = b; }
          if (hi - lo > bestV) { bestV = hi - lo; best = i; bestC = (lo + hi) / 2; }
        }
        if (best >= 0 && bestV >= cand.fs + 6) {
          gLab.append("text").attr("x", x(xs[best])).attr("y", bestC).attr("dy", "0.35em").attr("text-anchor", "middle")
            .attr("font-size", cand.fs).attr("font-weight", 600)
            .attr("fill", lum(c.color) > 0.36 ? INK : "#fff").text(cand.txt);
          placed = true; break;
        }
      }
      const last = s[s.length - 1], thEnd = y(last[0]) - y(last[1]);
      if (!placed && thEnd > 1.5) endLabels.push({ c, y0: (y(last[0]) + y(last[1])) / 2 });
    });
    // etiquetas al final (capas finas vivas hoy)
    endLabels.sort((a, b) => a.y0 - b.y0); endLabels.forEach(e => e.y = e.y0);
    for (let k = 0; k < 20; k++) for (let i = 1; i < endLabels.length; i++) {
      const gap = endLabels[i].y - endLabels[i - 1].y;
      if (gap < 15) { const d = (15 - gap) / 2; endLabels[i - 1].y -= d; endLabels[i].y += d; }
    }
    endLabels.forEach(e => {
      gLab.append("path").attr("d", `M${xEnd + 2},${e.y0} L${xEnd + 12},${e.y} H${xEnd + 16}`).attr("fill", "none").attr("stroke", e.c.color).attr("stroke-width", 1.5);
      gLab.append("text").attr("x", xEnd + 20).attr("y", e.y).attr("dy", "0.35em").attr("font-size", 12).attr("fill", INK).text(t(e.c.nombre));
    });

    // --- hitos (arriba) ---
    const gH = svg.append("g");
    hitos.forEach(h => {
      const ty = streamTop - 18 - h.level * ROW, cy = topAt(h.px);
      gH.append("path").attr("d", `M${h.px},${cy} V${ty + 5}`).attr("stroke", INK3).attr("stroke-width", 1).attr("fill", "none");
      gH.append("circle").attr("cx", h.px).attr("cy", cy).attr("r", 5).attr("fill", "#c2385a").attr("stroke", SURFACE).attr("stroke-width", 2);
      const a = h.url ? gH.append("a").attr("href", h.url).attr("target", "_blank").attr("rel", "noopener").attr("class", "bar-link") : gH;
      a.append("text").attr("x", h.x).attr("y", ty).attr("font-size", FS).attr("font-weight", 600).attr("fill", INK).text(h.label);
    });

    // --- títulos (abajo) ---
    const gT = svg.append("g");
    const botZone = streamBot + 20;
    titulos.forEach(d => {
      const ty = botZone + d.level * ROW, cy = botAt(d.px, d.capa) ;
      gT.append("path").attr("d", `M${d.px},${cy + 1} V${ty + 3}`).attr("stroke", INK3).attr("stroke-width", 1).attr("fill", "none");
      const a = d.url ? gT.append("a").attr("href", d.url).attr("target", "_blank").attr("rel", "noopener").attr("class", "bar-link") : gT;
      a.append("text").attr("x", d.x).attr("y", ty).attr("dy", "0.35em").attr("font-size", FS).attr("fill", INK2).text(d.label);
    });

    // --- eje X ---
    const axisY = botZone + nBot * ROW + 12;
    const gA = svg.append("g");
    gA.append("line").attr("x1", x(X0)).attr("x2", x(X1)).attr("y1", axisY).attr("y2", axisY).attr("stroke", RULE).attr("stroke-width", 1.5);
    d3.range(X0, X1 + 1).forEach(yr => {
      gA.append("line").attr("x1", x(yr)).attr("x2", x(yr)).attr("y1", axisY).attr("y2", axisY + (yr % 2 ? 4 : 7)).attr("stroke", RULE);
      if (yr % 2 === 0) gA.append("text").attr("x", x(yr)).attr("y", axisY + 22).attr("text-anchor", "middle").attr("font-size", 12).attr("fill", INK2).text(yr);
    });
    gA.append("text").attr("x", xEnd).attr("y", axisY + 22).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", INK3).text(xEnd - x(Math.floor(END)) > 30 ? t(DATA.textos.hoy) : "");

    // --- barras: centros y proyectos ---
    let cursor = axisY + 46;
    const BH = 20, BG = 4;
    function bars(title, list) {
      svg.append("text").attr("x", x(X0)).attr("y", cursor).attr("font-size", 13).attr("font-weight", 600).attr("fill", INK).text(title);
      cursor += 10;
      const items = list.map(d => {
        const a = Math.max(X0, d.desde), b = Math.min(d.hasta == null ? END : d.hasta, X1);
        const label = t(d.nombre) + (d.url ? " ↗" : "");
        const bx0 = x(a), bx1 = x(b);
        const tw = textW(label, 11.5) + 14, flip = bx0 + tw > W - 6; // sin sitio a la derecha: el texto acaba en el borde de la barra
        return { d, bx0, bx1, label, flip, x0: flip ? Math.min(bx0, bx1 - tw) : bx0, x1: flip ? bx1 : Math.max(bx1, bx0 + tw) };
      }).sort((p, q) => p.x0 - q.x0);
      const n = packLanes(items);
      items.forEach(it => {
        const yy = cursor + it.lane * (BH + BG), col = colorOf(it.d.tipo);
        const g = it.d.url ? svg.append("a").attr("href", it.d.url).attr("target", "_blank").attr("rel", "noopener").attr("class", "bar-link") : svg.append("g");
        g.append("rect").attr("x", it.bx0).attr("y", yy).attr("width", Math.max(3, it.bx1 - it.bx0 - 2)).attr("height", BH).attr("rx", 3).attr("fill", col).attr("fill-opacity", it.d.destacada ? 0.75 : 0.3);
        g.append("rect").attr("x", it.bx0).attr("y", yy).attr("width", 3).attr("height", BH).attr("fill", col);
        g.append("text").attr("x", it.flip ? it.bx1 - 8 : it.bx0 + 9).attr("text-anchor", it.flip ? "end" : "start").attr("y", yy + BH / 2).attr("dy", "0.35em").attr("font-size", 11.5).attr("font-weight", it.d.destacada ? 600 : 400).attr("fill", INK).text(it.label);
      });
      cursor += n * (BH + BG) + 26;
    }
    if (!EMBED) DATA.secciones.forEach(s => bars(t(s.titulo), s.items));
    svg.attr("viewBox", `0 0 ${W} ${EMBED ? axisY + 34 : cursor - 10}`);

    // --- leyenda ---
    const leg = d3.select("#legend"); leg.selectAll("*").remove();
    Object.keys(DATA.grupos).forEach(gk => {
      const g = leg.append("div").attr("class", "group");
      g.append("span").attr("class", "gname").text(t(DATA.grupos[gk]));
      DATA.capas.filter(c => c.grupo === gk).forEach(c => {
        const it = g.append("span").attr("class", "item")
          .on("mouseenter", () => highlight(c.id)).on("mouseleave", () => highlight(null));
        it.append("span").attr("class", "sw").style("background", c.color);
        it.append("span").text(t(c.corto));
      });
    });

    // --- tabla ---
    const tb = d3.select("#table"); tb.selectAll("*").remove();
    const table = tb.append("table");
    table.append("thead").append("tr").selectAll("th").data([DATA.textos.thCapa, DATA.textos.thGrupo, DATA.textos.thPeriodo, DATA.textos.thDesc]).join("th").text(d => t(d));
    table.append("tbody").selectAll("tr").data(DATA.capas).join("tr").selectAll("td")
      .data(c => [t(c.nombre), t(DATA.grupos[c.grupo]), period(c), t(c.desc)]).join("td").text(d => d);
  }

  d3.selectAll(".lang button").on("click", function () { lang = this.dataset.lang; history.replaceState(null, "", "#" + lang); render(); });
  render();
}

// ---------- Arranque: CSV de data/ (o de ?datos=) y subida de archivos propios ----------
(function () {
  const BASE = (params.get("datos") || "data").replace(/\/?$/, "/");
  const aviso = d3.select("#aviso");
  let loaded = {};
  function show(texts) {
    const { DATA, avisos, bilingue } = CsvData.build(texts);
    aviso.html(avisos.length ? `${esc(UI.avisos[lang])}<ul>${avisos.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : "");
    if (!DATA.capas.length) return;
    start(DATA, bilingue);
  }
  CsvData.fetchAll(BASE).then(texts => { loaded = texts; show(texts); })
    .catch(err => aviso.html(`<strong>${esc(UI.errCarga[lang])}</strong> (${esc(err.message)}). ${location.protocol === "file:" ? esc(UI.errLocal[lang]) : ""}`));

  d3.select("#td-input").on("change", async function () {
    const files = [...this.files], nuevos = {};
    for (const f of files) { const k = f.name.toLowerCase().replace(/\.csv$/, "").replace(/\s*\(\d+\)$/, ""); if (CSV_FILES.includes(k)) nuevos[k] = await f.text(); }
    const nombres = Object.keys(nuevos);
    d3.select("#td-estado").text(nombres.length ? `${UI.tdCargados[lang]} ${nombres.map(n => n + ".csv").join(", ")}` : "—");
    if (!nombres.length) return;
    loaded = { ...loaded, ...nuevos }; // los archivos que no subas se toman del gráfico actual
    show(loaded);
  });
})();
</script>
