  }

  // ---------- Serie por capa ----------
  const [X0, X1] = DATA.dominio, END = DATA.hoy, STEP = 0.05;
  const xs = d3.range(X0, END + STEP / 2, STEP);
  const smooth = u => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
  function valueAt(c, x) {
    const ks = Object.keys(c.valores).map(Number).sort((a, b) => a - b);
    const px = ks.map(k => k + 0.5);
    let v;
    if (x <= px[0]) v = c.valores[ks[0]];
    else if (x >= px[px.length - 1]) v = c.valores[ks[ks.length - 1]];
    else { const i = d3.bisectRight(px, x) - 1; const u = (x - px[i]) / (px[i + 1] - px[i]); v = c.valores[ks[i]] * (1 - u) + c.valores[ks[i + 1]] * u; }
    return v;
  }
  function envelope(c, x) {
    const R = 0.8;
    // rampas centradas en la fecha: un relevo (acaba una capa, empieza otra) no deja hueco
    let env = (c.desde > X0) ? smooth((x - c.desde) / R + 0.5) : 1;
    if (c.hasta != null) env *= smooth((c.hasta - x) / R + 0.5);
    return env;
  }
  function gauss(arr, sigma) {
    const r = Math.ceil(sigma * 3), k = d3.range(-r, r + 1).map(i => Math.exp(-(i * i) / (2 * sigma * sigma)));
    return arr.map((_, i) => { let s = 0, w = 0; for (let j = -r; j <= r; j++) { const q = Math.min(arr.length - 1, Math.max(0, i + j)); s += arr[q] * k[j + r]; w += k[j + r]; } return s / w; });
  }
  const series = {};
  DATA.capas.forEach(c => {
    let raw = xs.map(x => valueAt(c, x));
    raw = gauss(raw, 0.3 / STEP);
    // la envolvente se aplica tras suavizar: la capa vale exactamente 0 fuera de su periodo
    series[c.id] = raw.map((v, i) => v * envelope(c, xs[i]));
  });
  const rows = xs.map((x, i) => { const r = { x }; DATA.capas.forEach(c => r[c.id] = series[c.id][i]); return r; });
  const stack = d3.stack().keys(DATA.capas.map(c => c.id)).offset(d3.stackOffsetSilhouette)(rows);

  // ---------- Empaquetado de etiquetas en niveles ----------
  function assignLevels(items) { // texto a la derecha de su línea guía; se coloca de derecha a izquierda
    const levels = [];
    items.slice().sort((p, q) => q.px - p.px).forEach(it => {
      let L = 0;
      for (;; L++) {
        const row = levels[L] || [];
        const overlap = row.some(b => it.x < b.x1 + 10 && it.x + it.w > b.x0 - 10);
        const crossed = levels.slice(L + 1).some(r => r.some(b => b.px > it.x - 6 && b.px < it.x + it.w + 6));
        if (!overlap && !crossed) break;
      }
      (levels[L] = levels[L] || []).push({ x0: it.x, x1: it.x + it.w, px: it.px });
      it.level = L;
    });
    return levels.length;
  }
  function packLanes(items) { // items: {x0, x1}
    const lanes = [];
    items.forEach(it => {
      let L = 0;
      while (lanes[L] != null && lanes[L] > it.x0 - 8) L++;
      lanes[L] = it.x1; it.lane = L;
    });
    return lanes.length;
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = (lang === "es" ? "Mi trayectoria" : "My career") + " · Javi Cantón-Correa";
    d3.select("#title").text(t(DATA.textos.titulo));
    d3.select("#subtitle").text(t(DATA.textos.subtitulo));
    d3.selectAll(".lang button").attr("aria-selected", function () { return this.dataset.lang === lang; });
    d3.select("#footer").html(t(DATA.textos.pie));
    d3.select("#table-summary").text(t(DATA.textos.tabla));

    const W = 1280, M = { l: 30, r: 210 };
    const x = d3.scaleLinear().domain([X0, X1]).range([M.l, W - M.r]);
    const xEnd = x(END);
    const svg = d3.select("#chart"); svg.selectAll("*").remove();
    svg.attr("aria-label", t(DATA.textos.titulo));

    // --- niveles de hitos (arriba) y títulos (abajo) ---
    const FS = 12, ROW = 17;
    const hitos = DATA.hitos.map(h => ({ ...h, px: x(h.x), label: t(h.texto) + (h.url ? " ↗" : "") })).sort((a, b) => a.px - b.px);
    hitos.forEach(h => { h.w = textW(h.label, FS, 600); h.x = h.px + 7; });
    hitos.forEach(h => { if (h.x + h.w > W - 8) h.x = W - 8 - h.w; });
    const nTop = assignLevels(hitos.map(h => h));
    const titulos = DATA.titulos.map(d => ({ ...d, px: x(d.x), label: t(d.texto) + (d.url ? " ↗" : "") })).sort((a, b) => a.px - b.px);
    titulos.forEach(d => { d.w = textW(d.label, FS); d.x = d.px + 7; });
    const nBot = assignLevels(titulos);

    const streamTop = 14 + nTop * ROW + 18, SH = 400, streamBot = streamTop + SH;
    const yExt = [d3.min(stack, s => d3.min(s, d => d[0])), d3.max(stack, s => d3.max(s, d => d[1]))];
    const y = d3.scaleLinear().domain(yExt).range([streamBot, streamTop]);
    const idx = px => Math.max(0, Math.min(xs.length - 1, Math.round((x.invert(px) - X0) / STEP)));
    const topAt = px => y(stack[stack.length - 1][idx(px)][1]);
    const botAt = (px, id) => { const s = id ? stack.find(s => s.key === id) : stack[0]; return y(s[idx(px)][0]); };

    // --- eje Y (rótulo) ---
    svg.append("text").attr("transform", `translate(12,${(streamTop + streamBot) / 2}) rotate(-90)`)
      .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", INK3).text(t(DATA.textos.ejeY));

    // --- capas ---
    const area = d3.area().defined(d => d[1] - d[0] > 0.004)
      .x(d => x(d.data.x)).y0(d => y(d[0])).y1(d => y(d[1])).curve(d3.curveMonotoneX);
    const gLayers = svg.append("g").attr("class", "layers");
    const tip = d3.select("#tooltip"), scroll = document.getElementById("scroll");
    function period(c) {
      const a = Math.floor(c.desde + 0.05), b = c.hasta == null ? t(DATA.textos.hoy) : Math.floor(c.hasta - 0.05);
      return a === b ? `${a}` : `${a} – ${b}`;
    }
    function showTip(ev, c) {
      const yr = Math.floor(x.invert(d3.pointer(ev, svg.node())[0]));
      tip.html(`<div class="tt-title"><span class="tt-sw" style="background:${c.color}"></span>${t(c.nombre)}</div>
        <div class="tt-meta">${t(DATA.grupos[c.grupo])} · ${period(c)}</div>
        <div>${t(c.desc)}</div>${c.proyectos ? `<div class="tt-proj">${t(DATA.textos.proyRel)}: ${c.proyectos}</div>` : ""}`);
      const r = scroll.getBoundingClientRect();
      let left = ev.clientX - r.left + scroll.scrollLeft + 14, top = ev.clientY - r.top + 14;
      const tw = tip.node().offsetWidth;
      if (ev.clientX + tw + 30 > window.innerWidth) left -= tw + 28;
      tip.style("left", left + "px").style("top", top + "px").classed("show", true);
    }
    function highlight(id) { svg.classed("dim", !!id); svg.selectAll(".layer").classed("on", function () { return this.dataset.id === id; }); }
    gLayers.selectAll("path").data(stack).join("path")
      .attr("class", "layer").attr("data-id", s => s.key)
      .attr("d", area).attr("fill", s => byId[s.key].color)
      .attr("stroke", SURFACE).attr("stroke-width", 1.4).attr("stroke-linejoin", "round")
      .on("mousemove", (ev, s) => { highlight(s.key); showTip(ev, byId[s.key]); })
      .on("mouseleave", () => { highlight(null); tip.classed("show", false); });

    // --- etiquetas directas ---
    const gLab = svg.append("g").attr("pointer-events", "none");
    const endLabels = [];
    stack.forEach(s => {
      const c = byId[s.key];
      const th = s.map(d => y(d[0]) - y(d[1]));
      let placed = false;
      for (const cand of [{ txt: t(c.nombre), fs: 13 }, { txt: t(c.nombre), fs: 11.5 }, { txt: t(c.corto), fs: 12 }, { txt: t(c.corto), fs: 10.5 }]) {
        const w = textW(cand.txt, cand.fs, 600) + 14, half = Math.ceil((w / 2) / (x(X0 + STEP) - x(X0)));
        let best = -1, bestV = 0, bestC = 0;
        for (let i = half; i < s.length - half; i++) {
          // banda horizontal común a toda la ventana: el texto debe caber entero dentro de la capa
          let lo = -Infinity, hi = Infinity;
          for (let j = i - half; j <= i + half; j++) { const a = y(s[j][1]), b = y(s[j][0]); if (a > lo) lo = a; if (b < hi) hi = b; }
          if (hi - lo > bestV) { bestV = hi - lo; best = i; bestC = (lo + hi) / 2; }
        }
        if (best >= 0 && bestV >= cand.fs + 6) {
          gLab.append("text").attr("x", x(xs[best])).attr("y", bestC).attr("dy", "0.35em").attr("text-anchor", "middle")
            .attr("font-size", cand.fs).attr("font-weight", 600)
            .attr("fill", lum(c.color) > 0.36 ? INK : "#fff").text(cand.txt);
          placed = true; break;
        }
      }
      const last = s[s.length - 1], thEnd = y(last[0]) - y(last[1]);
      if (!placed && thEnd > 1.5) endLabels.push({ c, y0: (y(last[0]) + y(last[1])) / 2 });
    });
    // etiquetas al final (capas finas vivas hoy)
    endLabels.sort((a, b) => a.y0 - b.y0); endLabels.forEach(e => e.y = e.y0);
    for (let k = 0; k < 20; k++) for (let i = 1; i < endLabels.length; i++) {
      const gap = endLabels[i].y - endLabels[i - 1].y;
      if (gap < 15) { const d = (15 - gap) / 2; endLabels[i - 1].y -= d; endLabels[i].y += d; }
    }
    endLabels.forEach(e => {
      gLab.append("path").attr("d", `M${xEnd + 2},${e.y0} L${xEnd + 12},${e.y} H${xEnd + 16}`).attr("fill", "none").attr("stroke", e.c.color).attr("stroke-width", 1.5);
      gLab.append("text").attr("x", xEnd + 20).attr("y", e.y).attr("dy", "0.35em").attr("font-size", 12).attr("fill", INK).text(t(e.c.nombre));
    });

    // --- hitos (arriba) ---
    const gH = svg.append("g");
    hitos.forEach(h => {
      const ty = streamTop - 18 - h.level * ROW, cy = topAt(h.px);
      gH.append("path").attr("d", `M${h.px},${cy} V${ty + 5}`).attr("stroke", INK3).attr("stroke-width", 1).attr("fill", "none");
      gH.append("circle").attr("cx", h.px).attr("cy", cy).attr("r", 5).attr("fill", "#c2385a").attr("stroke", SURFACE).attr("stroke-width", 2);
      const a = h.url ? gH.append("a").attr("href", h.url).attr("target", "_blank").attr("rel", "noopener").attr("class", "bar-link") : gH;
      a.append("text").attr("x", h.x).attr("y", ty).attr("font-size", FS).attr("font-weight", 600).attr("fill", INK).text(h.label);
    });

    // --- títulos (abajo) ---
    const gT = svg.append("g");
    const botZone = streamBot + 20;
    titulos.forEach(d => {
      const ty = botZone + d.level * ROW, cy = botAt(d.px, d.capa) ;
      gT.append("path").attr("d", `M${d.px},${cy + 1} V${ty + 3}`).attr("stroke", INK3).attr("stroke-width", 1).attr("fill", "none");
      const a = d.url ? gT.append("a").attr("href", d.url).attr("target", "_blank").attr("rel", "noopener").attr("class", "bar-link") : gT;
      a.append("text").attr("x", d.x).attr("y", ty).attr("dy", "0.35em").attr("font-size", FS).attr("fill", INK2).text(d.label);
    });

    // --- eje X ---
    const axisY = botZone + nBot * ROW + 12;
    const gA = svg.append("g");
    gA.append("line").attr("x1", x(X0)).attr("x2", x(X1)).attr("y1", axisY).attr("y2", axisY).attr("stroke", RULE).attr("stroke-width", 1.5);
    d3.range(X0, X1 + 1).forEach(yr => {
      gA.append("line").attr("x1", x(yr)).attr("x2", x(yr)).attr("y1", axisY).attr("y2", axisY + (yr % 2 ? 4 : 7)).attr("stroke", RULE);
      if (yr % 2 === 0) gA.append("text").attr("x", x(yr)).attr("y", axisY + 22).attr("text-anchor", "middle").attr("font-size", 12).attr("fill", INK2).text(yr);
    });
    gA.append("text").attr("x", xEnd).attr("y", axisY + 22).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", INK3).text(xEnd - x(2026) > 30 ? t(DATA.textos.hoy) : "");

    // --- barras: centros y proyectos ---
    let cursor = axisY + 46;
    const BH = 20, BG = 4;
    function bars(title, list, oneEach) {
      svg.append("text").attr("x", x(X0)).attr("y", cursor).attr("font-size", 13).attr("font-weight", 600).attr("fill", INK).text(title);
      cursor += 10;
      const items = list.map(d => {
        const a = Math.max(X0, d.desde), b = Math.min(d.hasta == null ? END : d.hasta, X1);
        const label = t(d.nombre) + (d.url ? " ↗" : "");
        const bx0 = x(a), bx1 = x(b);
        const tw = textW(label, 11.5) + 14, flip = bx0 + tw > W - 6; // sin sitio a la derecha: el texto acaba en el borde de la barra
        return { d, bx0, bx1, label, flip, x0: flip ? Math.min(bx0, bx1 - tw) : bx0, x1: flip ? bx1 : Math.max(bx1, bx0 + tw) };
      }).sort((p, q) => p.x0 - q.x0);
      let n; if (oneEach) { items.forEach((it, i) => it.lane = i); n = items.length; } else n = packLanes(items);
      items.forEach(it => {
        const yy = cursor + it.lane * (BH + BG), col = colorOf(it.d.tipo);
        const g = it.d.url ? svg.append("a").attr("href", it.d.url).attr("target", "_blank").attr("rel", "noopener").attr("class", "bar-link") : svg.append("g");
        g.append("rect").attr("x", it.bx0).attr("y", yy).attr("width", Math.max(3, it.bx1 - it.bx0 - 2)).attr("height", BH).attr("rx", 3).attr("fill", col).attr("fill-opacity", it.d.destacada ? 0.75 : 0.3);
        g.append("rect").attr("x", it.bx0).attr("y", yy).attr("width", 3).attr("height", BH).attr("fill", col);
        g.append("text").attr("x", it.flip ? it.bx1 - 8 : it.bx0 + 9).attr("text-anchor", it.flip ? "end" : "start").attr("y", yy + BH / 2).attr("dy", "0.35em").attr("font-size", 11.5).attr("font-weight", it.d.destacada ? 600 : 400).attr("fill", INK).text(it.label);
      });
      cursor += n * (BH + BG) + 26;
    }
    bars(t(DATA.textos.centros), DATA.centros);
    bars(t(DATA.textos.proyectos), DATA.proyectos);
    bars(t(DATA.textos.competencias), DATA.competencias, true);

    svg.attr("viewBox", `0 0 ${W} ${cursor - 10}`);

    // --- leyenda ---
    const leg = d3.select("#legend"); leg.selectAll("*").remove();
    Object.keys(DATA.grupos).forEach(gk => {
      const g = leg.append("div").attr("class", "group");
      g.append("span").attr("class", "gname").text(t(DATA.grupos[gk]));
      DATA.capas.filter(c => c.grupo === gk).forEach(c => {
        const it = g.append("span").attr("class", "item")
          .on("mouseenter", () => highlight(c.id)).on("mouseleave", () => highlight(null));
        it.append("span").attr("class", "sw").style("background", c.color);
        it.append("span").text(t(c.corto));
      });
    });

    // --- tabla ---
    const tb = d3.select("#table"); tb.selectAll("*").remove();
    const table = tb.append("table");
    table.append("thead").append("tr").selectAll("th").data([DATA.textos.thCapa, DATA.textos.thGrupo, DATA.textos.thPeriodo, DATA.textos.thDesc]).join("th").text(d => t(d));
    table.append("tbody").selectAll("tr").data(DATA.capas).join("tr").selectAll("td")
      .data(c => [t(c.nombre), t(DATA.grupos[c.grupo]), period(c), t(c.desc)]).join("td").text(d => d);
  }

  d3.selectAll(".lang button").on("click", function () { lang = this.dataset.lang; history.replaceState(null, "", "#" + lang); render(); });
  render();
})();
</script>
</body>
</html>
